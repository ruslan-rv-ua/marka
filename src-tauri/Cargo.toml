[package]
name = "marka"
version = "0.1.0"
description = "A fast markdown file viewer for Windows"
authors = []
edition = "2021"

[lib]
name = "marka_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-cli = "2"
sys-locale = "0.3"
open = "5.0"
